name: Feature request
description: Suggest a user-facing SchoolBrief improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need or friction first.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like SchoolBrief to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would this matter to you or your family?
      description: Explain the practical benefit, not just the requested UI or implementation.
    validations:
      required: true
  - type: textarea
    id: origin
    attributes:
      label: What prompted this request?
      description: For example, something you encountered in the app, a school workflow you repeat, another public tool, or a limitation you noticed.
  - type: textarea
    id: context
    attributes:
      label: Additional context / public source
      description: Examples, public source links, or screenshots are welcome if they contain no private information.
