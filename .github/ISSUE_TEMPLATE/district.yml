name: District request
description: Request support for another public school district
title: "[District] "
body:
  - type: input
    id: district
    attributes:
      label: School district
      placeholder: Oconee County School District
    validations:
      required: true
  - type: input
    id: state
    attributes:
      label: State
      placeholder: South Carolina
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official district website
      description: If known.
  - type: textarea
    id: reason
    attributes:
      label: Why would this district be useful to add?
      description: Optional context such as local interest or schools you would use.
